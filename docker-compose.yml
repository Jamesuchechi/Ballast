services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ballast-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ballast
      POSTGRES_PASSWORD: ballast_dev_password
      POSTGRES_DB: ballast_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballast -d ballast_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
