# Render Blueprint for Ballast Worker
# Docs: https://render.com/docs/blueprint-spec
# Note: Render Free Tier only supports 'type: web' services (which spin down after 15m of inactivity).
# The worker exposes a lightweight HTTP health/wake server on PORT 10000, allowing it to run on
# Render's Free tier and wake up automatically on incoming traffic or when pinged by the frontend.

services:
  - type: web
    name: ballast-worker
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run db:migrate
    startCommand: npm run worker
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Database connection (Points to the same PostgreSQL database as the Vercel Next.js app)
      - key: DATABASE_URL
        sync: false
      # Redis connection for BullMQ (Points to the same Redis / Upstash instance as Vercel)
      - key: REDIS_URL
        sync: false
      # Optional Upstash Redis direct credentials if used instead of REDIS_URL
      - key: UPSTASH_REDIS_URL
        sync: false
      # Multi-provider LLM API keys (Required for writer and critic pipeline execution)
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional Cloud Object Storage (Cloudflare R2 / AWS S3) for persistent PDF storage across deploys
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

