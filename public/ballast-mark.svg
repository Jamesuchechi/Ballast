<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Outer Console Tile -->
  <rect width="128" height="128" rx="28" fill="#050608"/>
  <rect x="1" y="1" width="126" height="126" rx="27" stroke="url(#ballastBorderGrad)" stroke-width="2"/>
  <circle cx="64" cy="64" r="50" fill="url(#ballastAmbientRadial)" opacity="0.6"/>

  <defs>
    <radialGradient id="ballastAmbientRadial" cx="50%" cy="50%" r="50%">
      <stop stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ballastBorderGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ballastCoreGrad" x1="20" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6ee7b7"/>
      <stop offset="0.2" stop-color="#34d399"/>
      <stop offset="0.6" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="ballastIntenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Horizon Gyro Bar -->
  <line x1="36" y1="48" x2="92" y2="48" stroke="url(#ballastCoreGrad)" stroke-width="7" stroke-linecap="round" filter="url(#ballastIntenseGlow)"/>
  <!-- Horizon Calibration Marks -->
  <line x1="46" y1="42" x2="46" y2="54" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="82" y1="42" x2="82" y2="54" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Top Gyro Pivot Ring -->
  <circle cx="64" cy="32" r="10" stroke="url(#ballastCoreGrad)" stroke-width="6.5" filter="url(#ballastIntenseGlow)"/>
  <circle cx="64" cy="32" r="3.5" fill="#34d399"/>

  <!-- Central Keel Spine -->
  <line x1="64" y1="42" x2="64" y2="96" stroke="url(#ballastCoreGrad)" stroke-width="8" stroke-linecap="round" filter="url(#ballastIntenseGlow)"/>

  <!-- Symmetrical Dual-Fluke Ballast Anchor Arc -->
  <path d="M34 70 C34 88, 47 101, 64 101 C81 101, 94 88, 94 70" stroke="url(#ballastCoreGrad)" stroke-width="8" stroke-linecap="round" filter="url(#ballastIntenseGlow)"/>

  <!-- Left Fluke Tip (Verification Gate 1) -->
  <path d="M26 70 L34 62 L42 70" stroke="url(#ballastCoreGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Fluke Tip (Verification Gate 2) -->
  <path d="M86 70 L94 62 L102 70" stroke="url(#ballastCoreGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Citation Grounding Diamond Node -->
  <polygon points="64,58 72,68 64,78 56,68" fill="#a7f3d0" filter="url(#ballastIntenseGlow)"/>
</svg>
