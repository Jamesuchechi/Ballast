<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#050608"/>
  <rect width="32" height="32" rx="8" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4"/>
  <defs>
    <linearGradient id="ballastGrad" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="ballastGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#10b981" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Horizon Calibration Bar -->
  <line x1="9" y1="12" x2="23" y2="12" stroke="url(#ballastGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Top Gyro Ring -->
  <circle cx="16" cy="8" r="2.5" stroke="url(#ballastGrad)" stroke-width="1.8"/>
  <!-- Central Keel Shaft -->
  <line x1="16" y1="10" x2="16" y2="24" stroke="url(#ballastGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Symmetrical Dual-Fluke Ballast Anchor Arc -->
  <path d="M8.5 17.5C8.5 22.2 11.8 25.5 16 25.5C20.2 25.5 23.5 22.2 23.5 17.5" stroke="url(#ballastGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Left Wing Fluke Tip -->
  <path d="M6.5 17.5L8.5 15.5L10.5 17.5" stroke="url(#ballastGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Wing Fluke Tip -->
  <path d="M21.5 17.5L23.5 15.5L25.5 17.5" stroke="url(#ballastGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Central Grounding Citation Node -->
  <polygon points="16,14.5 18,17 16,19.5 14,17" fill="#34d399" filter="url(#ballastGlow)"/>
</svg>
